name: Feature request
description: Suggest an idea for lompii.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like lompii to do?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

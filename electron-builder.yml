appId: com.tessera.app
productName: Tessera
directories:
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
  - "**/node_modules/onnxruntime-node/**"
win:
  target: nsis
mac:
  target: dmg
linux:
  target: AppImage

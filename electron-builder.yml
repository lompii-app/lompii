appId: com.lompii.app
productName: lompii
directories:
  output: release
files:
  - out/**
  - package.json
  # the browser build of onnxruntime; lompii runs CLIP through onnxruntime-node
  - "!**/node_modules/onnxruntime-web/**"
  # better-sqlite3's C sources; the compiled module is all that's loaded
  - "!**/node_modules/better-sqlite3/{deps,src}/**"
# the Chrome extension, so Settings can point "Load unpacked" at a real folder
extraResources:
  - from: extension
    to: extension
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
  - "**/node_modules/onnxruntime-node/**"
# where the installed app looks for updates (src/main/updates.ts); each release needs the
# installer, its .blockmap and latest.yml attached
publish:
  provider: github
  owner: Brosski224
  repo: lompii
win:
  target: nsis
  # onnxruntime-node ships every platform's binaries (~290 MB); keep the Windows x64 ones
  files:
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/{darwin,linux}/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**"
    - "!**/node_modules/better-sqlite3/prebuilds/!(win32-x64.node)"
mac:
  target: dmg
linux:
  target: AppImage
